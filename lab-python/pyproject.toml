[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deviceintelligence-lab"
version = "3.0.1"
description = "DeviceIntelligence test-token lab: mint attestation chains and issue verdict tokens for backend end-to-end testing (lab tooling, never production trust)"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["deviceintelligence-verifier", "pytest"]

[project.scripts]
di-lab = "deviceintelligence_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
