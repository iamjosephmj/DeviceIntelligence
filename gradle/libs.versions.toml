[versions]
agp = "8.13.2"
# The last PUBLISHED deviceintelligence plugin version that external consumers resolve.
# In-tree this alias is substituted by the composite build (see the
# includeBuild("deviceintelligence-gradle") note in settings.gradle.kts), so the value only
# matters to real consumers. It intentionally differs from VERSION_NAME in
# gradle.properties (the next in-development version); bump this at release
# time to match the tag.
deviceintelligence = "0.5.2"
kotlin = "2.2.20"
# kotlinx-coroutines 1.10.x is the line built with/for Kotlin 2.x.
kotlinx-coroutines = "1.10.2"
# androidx.lifecycle 2.8.x is the latest stable line that still
# supports the sample's compileSdk 36 / minSdk 28 floor without
# pulling in newer AGP requirements.
androidx-lifecycle = "2.8.7"
junit = "4.13.2"
# androidx.test.* is the AndroidJUnitRunner / ApplicationProvider stack
# used by `:deviceintelligence` instrumented smoke tests. Pinned to the
# stable lines compatible with AGP 8.13 + compileSdk 36; bumping AGP
# typically requires re-checking these.
androidx-test-core = "1.6.1"
androidx-test-ext-junit = "1.2.1"
# AndroidJUnitRunner ships in androidx.test:runner — separate artifact
# from ext.junit (which only ships AndroidJUnit4 + ApplicationProvider).
# testInstrumentationRunner references the runner class by name; without
# this dep on androidTest classpath, the instrumentation start fails with
# ClassNotFoundException at test-run time, not at build time.
androidx-test-runner = "1.6.2"
# Sample-app scroll feel: Flinger (fling physics) + Squishy (overscroll effects).
flinger = "2.1.1"
squishy = "2.2.1"
# Compose BOM pins every androidx.compose.* artifact to one tested set, so the
# individual UI deps below carry no version of their own. 2024.09.x is the line
# that pairs with Kotlin 2.2.x's bundled compiler plugin.
androidx-compose-bom = "2024.09.03"
androidx-activity-compose = "1.9.3"
androidx-navigation-compose = "2.8.4"
# Hilt 2.52 is the first line with full KSP support on Kotlin 2.0.x; the older
# kapt path is not used here.
hilt = "2.56.2"
androidx-hilt-navigation-compose = "1.2.0"
# KSP is versioned against the exact Kotlin version, not a range. Bumping
# `kotlin` above WILL break the build until this is bumped to match.
ksp = "2.2.20-2.0.4"
mockk = "1.13.13"

[libraries]
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation-compose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidx-hilt-navigation-compose" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
flinger = { group = "com.github.iamjosephmj", name = "flinger", version.ref = "flinger" }
squishy = { group = "com.github.iamjosephmj", name = "Squishy", version.ref = "squishy" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
deviceintelligence = { id = "tech.thessemaj.deviceintelligence", version.ref = "deviceintelligence" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
