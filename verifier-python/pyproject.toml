[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deviceintelligence-verifier"
version = "3.0.0"
description = "DeviceIntelligence backend token verifier (Python port of the Kotlin/JVM verifier)"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deviceintelligence_verifier = ["resources/*.txt", "resources/*.json"]
