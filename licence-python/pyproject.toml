[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deviceintelligence-licence"
version = "3.0.1"
description = "DeviceIntelligence licence generator: mints the RVN2 server.key asset (X25519 public half + signed licence) and its backend private PEM"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.scripts]
di-licence = "deviceintelligence_licence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
